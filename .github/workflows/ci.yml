name: ci

# Two jobs, split by what they cost:
#   * checks -- source-only gates against the core revision CORE_REF pins. A
#               checkout and an interpreter, so every push gets an answer fast.
#   * test   -- builds the core library with this checkout as its MATLAB
#               binding and runs the MATLAB test suite through loadlibrary.
#               The runners have no GPU, so the library is built CPU-only.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The compatibility floor; keep in step with release-mltbx.yml.
  MATLAB_RELEASE: R2023b

jobs:
  checks:
    name: Source checks
    runs-on: ubuntu-24.04
    outputs:
      core_ref: ${{ steps.core.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned core revision
        id: core
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_version.py
          echo "ref=$(tr -d '[:space:]' < CORE_REF)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: kinsky-main/nlo-rk4ip-code
          ref: ${{ steps.core.outputs.ref }}
          path: core

      # The C API constants this binding re-declares must agree with the core's
      # canonical list.
      - name: Check the binding API constants
        run: python3 core/tools/check_api_parity.py --bindings matlab --matlab-dir .

      # Every libstruct / libpointer type name in the wrapper must resolve to a
      # typedef in the core's nlolib_matlab.h.
      - name: Check the binding C type names
        run: >
          cmake -DNLOLIB_SOURCE_DIR=core "-DNLOLIB_MATLAB_DIR=${{ github.workspace }}"
          -P core/cmake/check_matlab_binding_types.cmake

  test:
    name: Build and test (ubuntu-24.04)
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: kinsky-main/nlo-rk4ip-code
          ref: ${{ needs.checks.outputs.core_ref }}
          path: core

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ env.MATLAB_RELEASE }}
          cache: true

      # Vulkan is off here, unlike the release build. On a runner that has the
      # Vulkan loader but no driver, the default AUTO backend fails instance
      # creation and propagate returns an error instead of using the CPU, which
      # would fail every FFI test that propagates. With the backend compiled
      # out, AUTO is the CPU and the whole suite runs.
      #
      # nlo_configure_verified fails if any -D did not reach the project; the
      # option names are unprefixed and a misspelled one is silently ignored.
      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          source tools/cmake_options.sh
          NLO_SOURCE_DIR=core nlo_configure_verified build \
            CMAKE_BUILD_TYPE=Release \
            BUILD_TESTING=ON \
            NLOLIB_BUILD_MATLAB_TESTS=ON \
            NLOLIB_BUILD_DOCS=OFF \
            NLOLIB_BUILD_BENCHMARKS=OFF \
            NLOLIB_BUILD_EXAMPLES=OFF \
            ENABLE_VULKAN_BACKEND=OFF \
            ENABLE_VKFFT=OFF \
            NLOLIB_MATLAB_DIR="$GITHUB_WORKSPACE"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run the MATLAB-free checks
        run: ctest --test-dir build --build-config Release --output-on-failure -R '^test_matlab_(binding_types|header_abi)$'

      # The same script the test_matlab_bindings CTest case runs, started
      # through the action instead: on a hosted runner MATLAB is only licensed
      # when launched that way, so `matlab -batch` from ctest cannot start.
      # Asked of the build rather than assumed: where the library lands
      # depends on the generator and on which bindings are configured.
      - name: Locate the built library
        shell: bash
        run: |
          set -euo pipefail
          library="$(find "$GITHUB_WORKSPACE" -name 'libnlolib.so' -not -path '*/matlab_toolbox/*' | head -n 1)"
          test -n "$library"
          echo "NLOLIB_LIBRARY=$library" >> "$GITHUB_ENV"
          echo "Built library: $library"

      - name: Run the MATLAB tests
        uses: matlab-actions/run-command@v3
        env:
          NLOLIB_API_PARITY_MANIFEST: ${{ github.workspace }}/core/tests/api_parity.json
        with:
          command: run('tests/run_matlab_tests.m')
